    <div class="container">
      <a href="./index.html" class="btn-close">
        <svg class="icon btn-close__icon">
          <use xlink:href="#close-btn"></use>
        </svg>
      </a>
      <div class="header">
        <a href="#!" class="header__link header__link_active">Login</a>
        <a href="#!" class="header__link">Register</a>
      </div>
      <h1 class="heading">Enter your email and password to register.</h1>
      <form class="form" action="https://fom.in.ua/echo">
        <input
          class="form__input"
          type="text"
          name="Username"
          placeholder="Username"
          required
        />
        <input
          minlength="3"
          maxlength="40"
          class="form__input"
          type="email"
          name="Email"
          placeholder="Enter your email address"
          required
        />
        <div class="password-container">
          <input
            minlength="8"
            maxlength="16"
            class="form__input form__input_password"
            type="password"
            name="Password"
            placeholder="Password"
            required
          />
          <button type="button" class="btn-eye">
            <svg class="icon btn-eye__icon">
              <use xlink:href="#hide"></use>
            </svg>
          </button>
        </div>
        <input
          minlength="8"
          maxlength="16"
          class="form__input"
          type="password"
          name="ConfirmPassword"
          placeholder="Confirm Password"
          required
        />
        <div class="form__btn-wrapper">
          <button class="form__button" type="submit">Register</button>
        </div>
      </form>
      <h2 class="subheading">Or register with</h2>
      <div class="footer">
        <a class="footer__link" href="#!">
          <svg class="icon footer__icon">
            <use xlink:href="#google"></use>
          </svg>
          Continue with Google
        </a>
        <a class="footer__link" href="#!">
          <svg class="icon footer__icon">
            <use xlink:href="#facebook-reg"></use>
          </svg>
          Continue with Facebook
        </a>
      </div>
    </div>
